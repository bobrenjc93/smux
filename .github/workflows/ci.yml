name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # The differential test compares smux's wire behavior against real tmux.
      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: gofmt -l . && test -z "$(gofmt -l .)"

      - run: go vet ./...

      - run: go build ./...

      - run: go test -race ./...
